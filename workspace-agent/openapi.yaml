openapi: 3.1.0
info:
  title: Nexus standalone workspace agent
  version: 1.0.0
  description: >-
    One instance per host (debian or nixos). All v1 routes require a separate
    per-host Bearer token. Strict read-only allowlisted filesystem access.
servers:
  - url: http://127.0.0.1:8896
    description: Local loopback only; use a private authenticated HTTPS proxy for remote calls.
security:
  - HostBearer: []
components:
  securitySchemes:
    HostBearer:
      type: http
      scheme: bearer
      description: Service token from NEXUS_WORKSPACE_TOKEN, unique per host; not a Cloudflare JWT.
  parameters:
    hostQuery:
      in: query
      name: host
      required: true
      schema: {type: string, example: debian}
      description: Must match the local NEXUS_WORKSPACE_HOST; never forwards requests to another host.
    idPath:
      in: path
      name: id
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
    relativePath:
      in: query
      name: path
      required: false
      schema: {type: string, maxLength: 512, example: src}
      description: Relative directory path, no dot segments, hidden segments, absolute paths or symlinks.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, example: invalid_path}
    Workspace:
      type: object
      required: [id, name]
      properties:
        id: {type: string, example: projects}
        name: {type: string, example: Projects}
        read_only: {type: boolean, const: true}
        capabilities:
          type: array
          maxItems: 7
          items: {type: string, enum: [list, read_file, inventory, find_text, git_status, git_diff, git_diff_staged]}
    Entry:
      type: object
      required: [name, path, kind]
      properties:
        name: {type: string, example: main.go}
        path: {type: string, example: src/main.go}
        kind: {type: string, enum: [directory, file]}
    TextHit:
      type: object
      required: [path, line, text]
      properties:
        path: {type: string}
        line: {type: integer, minimum: 1}
        text: {type: string, maxLength: 240}
    TaskRequest:
      type: object
      additionalProperties: false
      required: [host, workspace_id, operation]
      properties:
        host: {type: string, example: nixos}
        workspace_id: {type: string, example: projects}
        operation: {type: string, enum: [inventory, find_text, git_status, git_diff, git_diff_staged]}
        path: {type: string, default: ''}
        query: {type: string, maxLength: 80, description: 2-80 characters for find_text; empty or omitted otherwise}
    TaskResult:
      type: object
      required: [host, workspace_id, operation, status, entries, hits, scanned_files, truncated]
      properties:
        host: {type: string}
        workspace_id: {type: string}
        operation: {type: string, enum: [inventory, find_text, git_status, git_diff, git_diff_staged]}
        status: {type: string, enum: [completed]}
        entries: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/Entry'}}
        hits: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/TextHit'}}
        scanned_files: {type: integer, maximum: 24}
        truncated: {type: boolean}
        git:
          type: object
          required: [path, changes, diff, truncated]
          additionalProperties: false
          properties:
            path: {type: string}
            changes:
              type: array
              maxItems: 128
              items:
                type: object
                required: [path, index, worktree]
                additionalProperties: false
                properties:
                  path: {type: string}
                  index: {type: string, minLength: 1, maxLength: 1}
                  worktree: {type: string, minLength: 1, maxLength: 1}
            diff: {type: string, maxLength: 65536}
            truncated: {type: boolean}
paths:
  /healthz:
    get:
      security: []
      summary: Liveness only; no workspace metadata
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, const: ok}}}
  /v1/workspaces:
    get:
      summary: List locally configured allowlisted workspace aliases
      parameters: [{$ref: '#/components/parameters/hostQuery'}]
      responses:
        '200':
          description: Configured aliases without filesystem root paths
          content:
            application/json:
              schema:
                type: object
                required: [host, workspaces]
                properties:
                  host: {type: string}
                  workspaces: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Workspace'}}
        '401': {description: Missing or invalid Bearer token}
        '400': {description: Missing/mismatched host}
  /v1/workspaces/{id}/files:
    get:
      summary: List bounded subdirectories and permitted files
      parameters:
        - {$ref: '#/components/parameters/idPath'}
        - {$ref: '#/components/parameters/hostQuery'}
        - {$ref: '#/components/parameters/relativePath'}
      responses:
        '200':
          description: At most 128 entries returned (129 inspected to detect truncation)
          content:
            application/json:
              schema:
                type: object
                required: [host, workspace_id, path, entries, truncated]
                properties:
                  host: {type: string}
                  workspace_id: {type: string}
                  path: {type: string}
                  entries: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/Entry'}}
                  truncated: {type: boolean}
        '400': {description: Invalid path or host}
        '401': {description: Missing or invalid Bearer token}
        '403': {description: Forbidden or symlink path}
        '404': {description: Unknown workspace or missing directory}
  /v1/workspaces/{id}/context:
    get:
      summary: Read bounded UTF-8 text from one allowed regular file
      parameters:
        - {$ref: '#/components/parameters/idPath'}
        - {$ref: '#/components/parameters/hostQuery'}
        - {$ref: '#/components/parameters/relativePath'}
      responses:
        '200':
          description: File content, at most 65536 bytes
          content:
            application/json:
              schema:
                type: object
                required: [host, workspace_id, path, text, size_bytes]
                properties:
                  host: {type: string}
                  workspace_id: {type: string}
                  path: {type: string}
                  text: {type: string, maxLength: 65536}
                  size_bytes: {type: integer, maximum: 65536}
        '400': {description: Invalid path or host}
        '401': {description: Missing or invalid Bearer token}
        '403': {description: Forbidden/symlink path or disallowed file extension}
        '404': {description: Unknown workspace or missing file}
        '413': {description: Text exceeds 65536 bytes}
        '415': {description: Not a UTF-8 text file}
  /v1/subagents/tasks:
    post:
      summary: Bounded read-only inventory, text search or explicitly enabled sandboxed Git inspection
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskRequest'}
      responses:
        '200':
          description: Completed read-only task. Max duration 4 seconds, max 4 concurrent tasks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResult'}
        '400': {description: Invalid task, query, operation or host}
        '401': {description: Missing or invalid Bearer token}
        '403': {description: Forbidden path, unsupported repository layout or Git inspection disabled}
        '408': {description: Task reached 4-second limit}
        '413': {description: Request or Git output exceeds its byte limit}
        '415': {description: Unsupported non-UTF-8 Git output}
        '429': {description: Four tasks already executing}
        '503': {description: Git sandbox unavailable; no unsandboxed fallback}
