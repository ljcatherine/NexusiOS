openapi: 3.1.0
info:
  title: Nexus AI Gateway
  version: 1.0.0
  description: >-
    Contract for the currently implemented Nexus AI gateway. The service is a
    loopback-only prototype and is not deployed. Authenticated routes require a
    signed JWT access token and an operator-granted permission for its subject.
servers:
  - url: http://127.0.0.1:8787
    description: Local development only; the service binds to loopback.
tags:
  - name: Health
  - name: AI
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Check that the process is responding
      description: Does not verify inference or search provider availability.
      security: []
      responses:
        '200':
          description: Process is responding.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/models:
    get:
      tags: [AI]
      operationId: listModels
      summary: List operator-allowlisted upstream models
      x-required-permission: ai.models
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Allowlisted models only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /v1/context:
    get:
      tags: [AI]
      operationId: getActiveContextWindow
      summary: Read the active model server context size
      description: Returns only the configured context window reported by the upstream llama.cpp server.
      x-required-permission: ai.models
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active context window.
          content:
            application/json:
              schema:
                type: object
                required: [context_window_tokens]
                properties:
                  context_window_tokens:
                    type: integer
                    minimum: 1024
                    maximum: 1000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /v1/chat/completions:
    post:
      tags: [AI]
      operationId: createChatCompletion
      summary: Proxy a bounded chat completion request
      x-required-permission: ai.chat
      description: >-
        Requires ai.chat. The gateway streams the upstream successful response
        and passes through its content type. Requests are limited to 8 MiB, 100
        messages, 128 KiB per text message, and 16384 output tokens. At most one
        Nexus saved-host-snapshot function definition is accepted; the gateway
        validates but never executes tools. User bearer tokens are not forwarded
        to inference.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Upstream response, streamed when supported.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          description: AI capacity is currently full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/chat/completions/input_tokens:
    post:
      tags: [AI]
      operationId: countChatInputTokens
      summary: Count a chat request using the active upstream model tokenizer
      x-required-permission: ai.chat
      description: >-
        Validates the configured model and bounded chat schema, then asks the
        upstream llama.cpp tokenizer to apply its chat template and count input
        tokens. This does not run inference. Providers without this endpoint
        return an upstream failure; clients may then use a labeled estimate.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Exact upstream input token count for the current model.
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                properties:
                  input_tokens:
                    type: integer
                    minimum: 0
                    maximum: 1000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          description: Model switching is pending or AI capacity is busy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/search:
    post:
      tags: [AI]
      operationId: searchWeb
      summary: Search the operator-configured web provider
      x-required-permission: ai.search
      description: >-
        Requires ai.search, separately granted from ai.chat. Query text is sent
        to the configured Brave or SearXNG provider. The query is limited to
        512 UTF-8 bytes and obvious credentials/control characters are rejected.
        Result count is operator-bounded to at most 10 (default up to 5).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results with retrieval timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          description: Search provider is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/research:
    post:
      tags: [AI]
      operationId: researchWeb
      summary: Plan and perform bounded web research
      x-required-permission: ai.chat
      description: >-
        Requires both ai.chat and ai.search. The gateway sends bounded recent
        user/assistant context to the allowlisted model, validates its query
        plan, and performs up to three searches. The user's bearer token is not
        forwarded to inference or search. Planner failure in Always mode falls
        back to the latest user question when it is safe. Search remains
        unavailable unless an operator configures a provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequest'
      responses:
        '200':
          description: Validated planner decision and combined search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: AI capacity is currently full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/conversations:
    get:
      tags: [AI]
      operationId: listConversations
      summary: List metadata for the authenticated subject's saved conversations
      x-required-permission: ai.history
      description: >-
        Requires the separate ai.history grant and server-side AES-GCM storage
        configuration. The response contains identifiers, revisions, and update
        times, not message text. Entries are always scoped to the verified OIDC subject.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owner-scoped conversation metadata, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/ConversationMetadata' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Encrypted conversation storage is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AI]
      operationId: getConversation
      summary: Read one owner-scoped conversation
      x-required-permission: ai.history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversation with the current optimistic-lock revision.
          headers:
            ETag:
              schema: { type: string }
              description: Quoted decimal revision for conditional deletion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No conversation with this ID belongs to the verified subject. }
    put:
      tags: [AI]
      operationId: putConversation
      summary: Create or update an encrypted owner-scoped conversation
      x-required-permission: ai.history
      description: >-
        Requires `expected_revision: 0` to create, or the latest revision to
        update. Stale writes return 409. A conversation is limited to 4 MiB and
        500 messages; each subject is limited to 100 conversations and 64 MiB.
        The embedded conversation ID must match the path ID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationSyncRequest' }
      responses:
        '200':
          description: Saved revision metadata.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Revision is stale; refresh before retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { description: Conversation payload exceeds 4 MiB. }
        '507': { description: Subject conversation count or encrypted storage quota was reached. }
        '503':
          description: Encrypted conversation storage is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [AI]
      operationId: deleteConversation
      summary: Delete one owner-scoped conversation at the specified revision
      x-required-permission: ai.history
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: Quoted revision returned by GET or PUT.
      responses:
        '204': { description: Deleted the requested revision. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No conversation with this ID belongs to the verified subject. }
        '409': { description: Revision is stale; refresh before retrying. }
        '428': { description: If-Match revision is required. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Signed OIDC access token with the configured gateway audience. Opaque
        access tokens are not supported. The verified subject also needs the
        route's server-side permission grant.
  schemas:
    ModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, object]
            properties:
              id: { type: string }
              object: { const: model }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages, stream]
      properties:
        model: { type: string, minLength: 1 }
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role:
                type: string
                enum: [system, user, assistant, tool]
              content:
                oneOf:
                  - type: string
                    maxLength: 131072
                  - type: array
                    description: User text followed by one bounded JPEG data URL.
                    minItems: 2
                    maxItems: 2
                    items:
                      type: object
                      additionalProperties: false
                      oneOf:
                        - required: [type, text]
                          properties:
                            type: { const: text }
                            text: { type: string, maxLength: 131072 }
                        - required: [type, image_url]
                          properties:
                            type: { const: image_url }
                            image_url:
                              type: object
                              additionalProperties: false
                              required: [url]
                              properties:
                                url:
                                  type: string
                                  pattern: '^data:image/jpeg;base64,'
                                  maxLength: 716800
                                detail: { type: string, enum: [auto, low, high] }
              tool_calls:
                type: array
                maxItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [id, type, function]
                  properties:
                    id: { type: string, minLength: 1, maxLength: 128 }
                    type: { const: function }
                    function:
                      type: object
                      additionalProperties: false
                      required: [name, arguments]
                      properties:
                        name: { enum: [nexus_get_saved_host_snapshot, nexus_get_saved_service_inventory] }
                        arguments:
                          type: object
                          additionalProperties: false
                          required: [device_id]
                          properties:
                            device_id: { type: string, minLength: 1, maxLength: 64 }
              tool_call_id: { type: string, maxLength: 128 }
        stream: { type: boolean }
        max_tokens: { type: integer, minimum: 1, maximum: 16384 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, exclusiveMinimum: 0, maximum: 1 }
        tools:
          type: array
          maxItems: 2
          description: Only nexus_get_saved_host_snapshot and nexus_get_saved_service_inventory are accepted; the app requires explicit owner approval before sharing either cached result.
          items:
            type: object
            additionalProperties: false
            required: [type, function]
            properties:
              type: { const: function }
              function:
                type: object
                additionalProperties: false
                required: [name, description, parameters]
                properties:
                  name: { enum: [nexus_get_saved_host_snapshot, nexus_get_saved_service_inventory] }
                  description: { type: string, maxLength: 512 }
                  parameters:
                    type: object
                    required: [type, required, additionalProperties, properties]
                    properties:
                      type: { const: object }
                      required:
                        type: array
                        items: { const: device_id }
                        minItems: 1
                        maxItems: 1
                      additionalProperties: { const: false }
                      properties:
                        type: object
                        required: [device_id]
                        properties:
                          device_id:
                            type: object
                            required: [type, enum]
                            properties:
                              type: { const: string }
                              enum:
                                type: array
                                minItems: 1
                                maxItems: 20
                                items: { type: string, minLength: 1, maxLength: 64 }
        tool_choice:
          type: string
          const: auto
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 512 }
        count: { type: integer, minimum: 0, maximum: 10, default: 0 }
    SearchResponse:
      type: object
      required: [provider, retrieved_at, sources]
      properties:
        provider: { type: string }
        retrieved_at: { type: string, format: date-time }
        sources:
          type: array
          items:
            type: object
            required: [title, url, snippet]
            properties:
              title: { type: string }
              url: { type: string, format: uri }
              snippet: { type: string }
              content: { type: string }
              published_at: { type: string }
              age: { type: string }
    ResearchRequest:
      type: object
      additionalProperties: false
      required: [model, mode, max_queries, messages]
      properties:
        model: { type: string, minLength: 1, maxLength: 256 }
        mode: { type: string, enum: [automatic, always] }
        max_queries: { type: integer, minimum: 1, maximum: 3 }
        messages:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 4096 }
    ResearchResponse:
      type: object
      required: [decision, planner_available, planner_fallback, failed_queries]
      properties:
        decision:
          type: object
          required: [should_search, queries]
          properties:
            should_search: { type: boolean }
            queries: { type: array, maxItems: 3, items: { type: string, maxLength: 256 } }
        planner_available: { type: boolean }
        planner_fallback: { type: boolean }
        failed_queries: { type: integer, minimum: 0, maximum: 3 }
        search_response: { $ref: '#/components/schemas/SearchResponse' }
    ConversationMetadata:
      type: object
      required: [id, revision, updated_at]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    ConversationSyncRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, conversation]
      properties:
        expected_revision: { type: integer, minimum: 0 }
        conversation:
          type: object
          required: [id, connectionID, title, messages, updatedAt]
          properties:
            id: { type: string, format: uuid }
            connectionID: { type: string, format: uuid }
            modelID:
              type: string
              maxLength: 256
              description: >-
                Optional model identifier selected for this conversation. Older
                records may omit it and use the provider's configured default.
            skillID:
              type: string
              format: uuid
              description: >-
                Optional ID of a device-local prompt skill selected for this conversation.
                Skill content is not included in gateway history and must be configured
                separately on each device.
            title: { type: string, minLength: 1, maxLength: 240 }
            messages: { type: array, maxItems: 500, items: { type: object } }
            updatedAt: { type: number, exclusiveMinimum: 0 }
          additionalProperties: true
    ConversationRecord:
      allOf:
        - $ref: '#/components/schemas/ConversationMetadata'
        - type: object
          required: [conversation]
          properties:
            conversation: { $ref: '#/components/schemas/ConversationSyncRequest/properties/conversation' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
  responses:
    BadRequest:
      description: Request body is invalid or outside configured bounds.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Verified subject lacks the required server-side permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Per-subject request limit was reached.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UpstreamFailure:
      description: Configured upstream service failed or returned invalid data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
